# Pulsar Hub — base Docker Compose. Builds from source; production layers
# docker-compose.prod.yml on top (published image, production Caddyfile, restart policies).
#
# Invariants: only caddy publishes host ports; db, web and relay stay on the internal network;
# dependents wait on health checks; web migrates before it serves and the worker waits for web.
# The relay (remote console) holds gateways' tunnels. It has no database address and none of the
# web service's secrets: it shares one secret with web (RELAY_INTERNAL_SECRET) and asks web for
# every decision. Caddy routes it the tunnel address and the console origins, never its control port.
#
# Required in .env: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, DJANGO_SECRET_KEY and the rest
# of .env.example. The database URLs are composed below from the POSTGRES_* values.

name: pulsar-hub

# Least-privilege settings for the application containers. The image runs as uid 10001 and needs
# no Linux capabilities. The root filesystem is read-only; /tmp is a tmpfs (gunicorn's worker
# heartbeat files). Python bytecode is not written (PYTHONDONTWRITEBYTECODE in the image).
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp"]

# Every service logs to a file Docker rotates. Without this the default json-file log grows
# without limit, and one noisy peer (a gateway, a browser, a scanner) can fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Two database roles. The owner (POSTGRES_USER) creates the schema; only the web container's
# entrypoint uses it, for migrations, and removes it from the environment before the service
# starts. The service itself runs as POSTGRES_APP_USER, which cannot change the schema and can only
# add to and read the audit log. Passwords with URL-special characters (@ : / ? #) must be
# percent-encoded; a hex password (`openssl rand -hex 24`) avoids the question.
x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_APP_USER:?set in .env}:${POSTGRES_APP_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}

x-owner-env: &owner-env
  DATABASE_OWNER_URL: postgres://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}

networks:
  hub-net:
    driver: bridge

volumes:
  pgdata:
  caddy-data:
  caddy-config:

services:
  db:
    image: postgres:16-alpine
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [hub-net]
    # No ports are published. Only containers on hub-net can reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    <<: *hardened
    logging: *logging
    image: pulsar-hub:local              # named so `worker` reuses the same image
    build:
      context: .
    command: ["web"]
    env_file: [.env]
    environment:
      <<: [*app-env, *owner-env]
    depends_on:
      db:
        condition: service_healthy
    expose: ["8000"]                     # internal only; caddy proxies to it
    networks: [hub-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Migrations run before gunicorn binds; failures in this window do not count.
      start_period: 120s
      start_interval: 2s

  worker:
    <<: *hardened
    logging: *logging
    image: pulsar-hub:local              # same image as web, different role
    command: ["worker"]
    env_file: [.env]
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy       # web owns migrations; the worker starts after them
    networks: [hub-net]

  relay:
    <<: *hardened
    logging: *logging
    image: pulsar-hub:local              # same image, third role
    command: ["relay"]
    # Deliberately no env_file: only what the relay needs, named one by one.
    environment:
      RELAY_INTERNAL_SECRET: ${RELAY_INTERNAL_SECRET:-}
      CONSOLE_ORIGIN_TEMPLATE: ${CONSOLE_ORIGIN_TEMPLATE:-}
      CONSOLE_MAX_UPLOAD_MB: ${CONSOLE_MAX_UPLOAD_MB:-16}
      HUB_BASE_URL: ${HUB_BASE_URL:?set in .env}
      RELAY_HUB_URL: http://web:8000
      RELAY_ALLOW_PLAIN_HTTP: ${INSECURE_COOKIES:-false}
      NUM_PROXIES: ${NUM_PROXIES:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      web:
        condition: service_healthy
    expose: ["8001", "8002", "8003"]     # tunnel, console, control: internal only
    networks: [hub-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/control/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  caddy:
    image: caddy:2.8-alpine
    logging: *logging
    # no-new-privileges only: caddy runs as root in its image and binds 80/443.
    security_opt: ["no-new-privileges:true"]
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"                          # the ONLY service that publishes to the host
      - "443:443"
      - "443:443/udp"                    # HTTP/3
      # Bench only: every gateway's remote console on one extra plain-HTTP port (the development
      # Caddyfile). Production serves consoles on their own host names on 443 and drops this.
      - "${CONSOLE_BENCH_PORT:-8081}:8081"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [hub-net]
