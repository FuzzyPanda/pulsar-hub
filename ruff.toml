line-length = 120
target-version = "py312"
extend-exclude = ["migrations", "staticfiles", "media"]

[lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "S", "DJ", "T20"]
ignore = [
    "S101",  # assert is how pytest works
    "DJ012",  # scoping.py keeps the private helpers beside save(); order is deliberate
]

[lint.per-file-ignores]
"hub/settings.py" = ["S105"]  # model-name settings that contain the word "token"
"hub/test_settings.py" = ["F401", "F403", "F405", "S105"]
"tests/**" = ["S105", "S106", "S311"]
"scripts/**" = ["T201"]

[lint.isort]
known-first-party = ["hub", "tests"]
