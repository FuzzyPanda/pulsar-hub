title = "Pulsar Hub gitleaks config"

[extend]
useDefault = true

# Placeholders and throwaway test values only. Real secrets must never match these paths.
[[allowlists]]
description = "Placeholder values in .env.example and test-only settings"
paths = [
  '''^\.env\.example$''',
  '''^hub/test_settings\.py$''',
]

# One exact, public value: the sample Sec-WebSocket-Key printed in RFC 6455 section 1.3 (base64 of
# "the sample nonce"). tests/relay/test_relay.py sends it in a hand-made tunnel upgrade. Nothing
# else is excused here: not the file, not the rule.
[[allowlists]]
description = "The sample WebSocket key from RFC 6455, used in a test"
regexTarget = "secret"
regexes = ['''^dGhlIHNhbXBsZSBub25jZQ==$''']
